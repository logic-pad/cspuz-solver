name: Publish @logic-pad/cspuz-solver

on: workflow_dispatch

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Setup build environment
        run: |
          rustup target add wasm32-unknown-emscripten
          rustup update
          cd ${{ runner.temp }}
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
      - uses: actions/checkout@v4
        with:
          path: logic-pad-solver
      - name: Clone cspuz_core
        run: git clone --recursive https://github.com/semiexp/cspuz_core.git cspuz_core
      - name: Build
        run: |
          source ${{ runner.temp }}/emsdk/emsdk_env.sh
          cd logic-pad-solver/packages/@logic-pad/cspuz-solver
          npm run build-rust
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: logic-pad-solver
          path: logic-pad-solver/packages/@logic-pad/cspuz-solver/logic-pad-cspuz-solver-*.tgz
      - name: Publish package to npm
        run: |
          cd logic-pad-solver/packages/@logic-pad/cspuz-solver
          npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
